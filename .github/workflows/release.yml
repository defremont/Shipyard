name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            cmd: pnpm dist:linux
          - os: macos-latest
            cmd: pnpm dist:mac
          - os: windows-latest
            cmd: pnpm dist:win

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y dpkg fakeroot rpm

      - name: Install dependencies
        run: pnpm install

      - name: Prepare Windows signing credentials
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WIN_CSC_LINK }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: |
          if (-not [string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE)) {
            Add-Content -Path $env:GITHUB_ENV -Value "WIN_CSC_LINK=$($env:WINDOWS_CERTIFICATE)"
            Add-Content -Path $env:GITHUB_ENV -Value "WIN_CSC_KEY_PASSWORD=$($env:WINDOWS_CERTIFICATE_PASSWORD)"
          }

      - name: Prepare macOS signing and notarization credentials
        if: runner.os == 'macOS'
        env:
          MAC_CERTIFICATE: ${{ secrets.MAC_CSC_LINK }}
          MAC_CERTIFICATE_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY }}
          APPLE_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_TEAM: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [[ -n "$MAC_CERTIFICATE" ]]; then
            printf 'CSC_LINK=%s\n' "$MAC_CERTIFICATE" >> "$GITHUB_ENV"
            printf 'CSC_KEY_PASSWORD=%s\n' "$MAC_CERTIFICATE_PASSWORD" >> "$GITHUB_ENV"
          fi
          if [[ -n "$APPLE_API_KEY_BASE64" && -n "$APPLE_KEY_ID" && -n "$APPLE_ISSUER" && -n "$APPLE_TEAM" ]]; then
            umask 077
            key_path="$RUNNER_TEMP/AuthKey_Shipyard.p8"
            printf '%s' "$APPLE_API_KEY_BASE64" | base64 -D > "$key_path"
            printf 'APPLE_API_KEY=%s\n' "$key_path" >> "$GITHUB_ENV"
            printf 'APPLE_API_KEY_ID=%s\n' "$APPLE_KEY_ID" >> "$GITHUB_ENV"
            printf 'APPLE_API_ISSUER=%s\n' "$APPLE_ISSUER" >> "$GITHUB_ENV"
            printf 'APPLE_TEAM_ID=%s\n' "$APPLE_TEAM" >> "$GITHUB_ENV"
            echo "NOTARIZATION_CONFIGURED=true" >> "$GITHUB_ENV"
          fi

      - name: Build and package
        run: ${{ matrix.cmd }}
      - name: Verify Windows signatures
        if: runner.os == 'Windows' && env.WIN_CSC_LINK != ''
        env:
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
        shell: pwsh
        run: |
          $artifacts = Get-ChildItem release -Filter *.exe
          if (-not $artifacts) { throw 'No Windows executables were produced.' }
          foreach ($artifact in $artifacts) {
            $signature = Get-AuthenticodeSignature $artifact.FullName
            if ($signature.Status -ne 'Valid') {
              throw "Invalid Authenticode signature on $($artifact.Name): $($signature.Status)"
            }
          }

      - name: Verify macOS signatures
        if: runner.os == 'macOS' && env.CSC_LINK != ''
        env:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
        run: |
          find release -type d -name Shipyard.app -prune -print0 | while IFS= read -r -d '' app; do
            codesign --verify --deep --strict --verbose=2 "$app"
          done
          if [[ "${NOTARIZATION_CONFIGURED:-}" == "true" ]]; then
            for dmg in release/*.dmg; do
              xcrun stapler validate "$dmg"
            done
          fi

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.os }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.AppImage
            release/*.deb
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: find artifacts -type f 2>/dev/null || ls -R artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: artifacts/*
